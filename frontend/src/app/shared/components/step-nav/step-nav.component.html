<nav aria-label="Application steps">
	<ol class="step-nav list-unstyled mb-0">
		@for (step of steps; track step.path; let i = $index) {
			<li>
				<a class="step-nav__link" [routerLink]="step.path" routerLinkActive="step-nav__link--active" ariaCurrentWhenActive="step">
					<span class="step-nav__index">{{ i + 1 }}</span>
					{{ step.title }}
				</a>
			</li>
		}
	</ol>
</nav>
