<nav aria-label="Application steps">
	<ol class="step-nav list-unstyled mb-0">
		@for (step of steps; track step.path; let i = $index) {
			@let completed = completedSteps().has(step.path);
			<li>
				<a
					class="step-nav__link"
					[routerLink]="step.path"
					routerLinkActive="step-nav__link--active"
					ariaCurrentWhenActive="step"
				>
					<span class="step-nav__index" [class.step-nav__index--done]="completed" aria-hidden="true">
						@if (completed) {
							<svg
								viewBox="0 0 16 16"
								width="14"
								height="14"
								fill="none"
								stroke="currentColor"
								stroke-width="2.5"
							>
								<path d="M3 8.5 6.5 12 13 4.5" stroke-linecap="round" stroke-linejoin="round" />
							</svg>
						} @else {
							{{ i + 1 }}
						}
					</span>
					{{ step.title }}
					@if (completed) {
						<span class="visually-hidden">(completed)</span>
					}
				</a>
			</li>
		}
	</ol>
</nav>
