<header class="app-header">
	<div class="container d-flex align-items-center justify-content-between py-3">
		<span class="app-header__title">Home Loan Pre-Qualification</span>
		@if (hasApplication()) {
			<button type="button" class="btn btn-link app-header__start-over" (click)="startOver()">
				Not you? Start a new application
			</button>
		}
	</div>
</header>

<div class="container py-4">
	<div class="row g-4">
		<aside class="col-12 col-lg-3">
			<app-step-nav />
		</aside>
		<main class="col-12 col-lg-9">
			<router-outlet />
		</main>
	</div>
</div>
