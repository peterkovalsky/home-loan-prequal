# Local stack: SQL Server, a one-off migrator, then the API on http://localhost:5080.
#   cp .env.example .env && docker compose up -d --wait
name: homeloan

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64 # no arm64 image; runs under Rosetta on Apple Silicon
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set it in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  migrator:
    build:
      context: ./backend
      target: migrator
    environment:
      ConnectionStrings__Admin: Server=sqlserver,1433;Database=HomeLoan;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Database__AppLoginPassword: ${APP_DB_PASSWORD:?set it in .env}
    depends_on:
      sqlserver:
        condition: service_healthy

  api:
    build:
      context: ./backend
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # The least-privilege login created by the migrator, never sa.
      ConnectionStrings__HomeLoan: Server=sqlserver,1433;Database=HomeLoan;User Id=homeloan_app;Password=${APP_DB_PASSWORD};Encrypt=True;TrustServerCertificate=True
    ports:
      - "5080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully

volumes:
  sqldata:
