name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Front end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run test:ci

  e2e:
    name: E2E (Playwright, mock API)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  backend:
    name: Back end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

  infra:
    name: Infrastructure (CDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: infra/global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - run: dotnet build --configuration Release
      - run: dotnet test --no-build --configuration Release
      # No AWS credentials here on purpose: synth must be deterministic (AZs come from cdk.context.json).
      - run: npx -y aws-cdk@2.1145.0 synth --quiet

  e2e-api:
    name: E2E (Playwright, real API + SQL Server)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Start SQL Server, migrator and API
        run: |
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 90); do curl -sf http://localhost:5080/health/ready && exit 0; sleep 2; done
          docker compose logs; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run e2e
        env:
          E2E_CONFIGURATION: local-api
      - if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-api
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
