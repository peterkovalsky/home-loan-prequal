name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Front end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run test:ci

  e2e:
    name: E2E (Playwright, mock API)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  backend:
    name: Back end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

  infra:
    name: Infrastructure (CDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: infra/global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - run: dotnet build --configuration Release
      - run: dotnet test --no-build --configuration Release
      # No AWS credentials here on purpose: synth must be deterministic (AZs come from cdk.context.json).
      - run: npx -y aws-cdk@2.1145.0 synth --quiet

  e2e-api:
    name: E2E (Playwright, real API + SQL Server)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Start SQL Server, migrator and API
        run: |
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 90); do curl -sf http://localhost:5080/health/ready && exit 0; sleep 2; done
          docker compose logs; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run e2e
        env:
          E2E_CONFIGURATION: local-api
      - if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-api
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # Every push to main that passes all checks deploys to AWS, then proves the live API works.
  # Skipped until the one-time bootstrap has stored the role ARN (repo variable AWS_DEPLOY_ROLE_ARN).
  deploy:
    name: Deploy to AWS
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_DEPLOY_ROLE_ARN != ''
    needs: [frontend, backend, infra, e2e, e2e-api]
    runs-on: ubuntu-latest
    timeout-minutes: 75 # the first RDS SQL Server create alone takes ~20-30 minutes
    concurrency:
      group: deploy-aws
      cancel-in-progress: false # never interrupt a CloudFormation update; queue the next push
    environment:
      name: aws # the OIDC trust is pinned to this environment, which only main may deploy to
      url: ${{ steps.outputs.outputs.api_url }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: infra/global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
          role-session-name: github-${{ github.run_id }}
      - name: cdk deploy (builds and pushes the images, migrates, updates the API)
        working-directory: infra
        run: npx -y aws-cdk@2.1145.0 deploy HomeLoanData HomeLoanApi --require-approval never --outputs-file cdk-outputs.json
      - id: outputs
        run: echo "api_url=$(jq -r '.HomeLoanApi.ApiEndpoint' infra/cdk-outputs.json)" >> "$GITHUB_OUTPUT"
      - name: Smoke test the live API
        run: backend/scripts/smoke-test.sh "${{ steps.outputs.outputs.api_url }}"
      - name: Playwright journeys against the live API
        run: |
          scripts/write-aws-config.sh "${{ steps.outputs.outputs.api_url }}"
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
          E2E_CONFIGURATION=aws E2E_API_URL="${{ steps.outputs.outputs.api_url }}/api" npm run e2e
      - name: Summary
        if: always() && steps.outputs.outputs.api_url != ''
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "API: ${{ steps.outputs.outputs.api_url }}/api"
            echo ""
            echo '```bash'
            echo "scripts/write-aws-config.sh ${{ steps.outputs.outputs.api_url }}"
            echo "cd frontend && npm run start:aws"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-aws
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
