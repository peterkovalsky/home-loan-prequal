name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Front end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run test:ci

  # Phase 2 adds: backend (dotnet build + unit + integration tests with Testcontainers)
  # Phase 1d/2 adds: e2e (Playwright against the mock, then against docker compose)
